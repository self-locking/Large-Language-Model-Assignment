<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>TypeBurst AI - 璀璨星环版</title>
    <style>
        :root {
            --primary-glow: #00d8ff;
            --accent-purple: #a100ff;
            --planet-orange: #ff8c42;
        }

        body {
            display: flex; flex-direction: column; align-items: center;
            background: radial-gradient(circle at center, #1b2735 0%, #05050a 100%);
            color: white; font-family: 'Microsoft YaHei', sans-serif;
            margin: 0; padding: 20px; min-height: 100vh; overflow: hidden;
        }

        /* --- 音乐控制按钮 --- */
        #music-ctrl {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            background: rgba(0, 216, 255, 0.1);
            border: 1px solid rgba(0, 216, 255, 0.3);
            color: var(--primary-glow);
            padding: 8px 15px; border-radius: 20px;
            cursor: pointer; font-size: 14px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        #music-ctrl:hover { background: rgba(0, 216, 255, 0.3); box-shadow: 0 0 15px var(--primary-glow); }

        /* --- 星空背景装饰 --- */
        #star-field { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .star {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0.5; animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.3); } }

        /* --- 星球和装饰 --- */
        .planet-container { position: absolute; z-index: 1; pointer-events: none; opacity: 0.8; }
        .planet {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--color);
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.5), 0 0 20px var(--color);
            position: relative;
        }
        .ring {
            position: absolute; top: 50%; left: 50%;
            width: 160px; height: 40px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotateX(75deg) rotateZ(var(--angle));
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        .astronaut {
            position: absolute; width: 80px; z-index: 2;
            left: 10%; top: 20%;
            animation: astro-float 6s infinite ease-in-out;
            filter: drop-shadow(0 0 15px rgba(0,216,255,0.3));
        }
        @keyframes astro-float {
            0%, 100% { transform: translate3d(0,0,0) rotate(-5deg); }
            50% { transform: translate3d(15px, -25px, 0) rotate(5deg); }
        }

        .ufo-fixed {
            position: absolute; right: 12%; bottom: 25%; font-size: 45px;
            z-index: 2; animation: ufo-float 4s infinite ease-in-out;
            filter: drop-shadow(0 0 15px #00ff88);
        }
        @keyframes ufo-float {
            0%, 100% { transform: translate3d(0,0,0) scale(1); }
            50% { transform: translate3d(-10px, 15px, 0) scale(1.1); }
        }

        /* --- 游戏主界面 --- */
        h1 {
            color: var(--primary-glow); font-size: 2.5em;
            text-shadow: 0 0 20px rgba(0,216,255,0.8);
            margin-top: 0; z-index: 10; letter-spacing: 5px;
        }

        #game-stage {
            position: relative; width: 900px; height: 600px;
            background: rgba(10, 25, 47, 0.4);
            border: 2px solid rgba(0, 216, 255, 0.3);
            border-radius: 25px; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); z-index: 5;
        }

        #control-panel { margin-bottom: 15px; z-index: 10; }
        select {
            padding: 10px 25px; border-radius: 25px;
            background: #16213e; color: #00d8ff;
            border: 1px solid #00d8ff; cursor: pointer; outline: none;
        }

        #input-container { margin-top: 25px; z-index: 10; }
        input {
            padding: 18px 30px; font-size: 24px; width: 500px;
            border-radius: 50px; border: 2px solid var(--primary-glow);
            background: rgba(15, 52, 96, 0.9); color: white;
            text-align: center; outline: none; transition: 0.3s;
        }
        input:focus { box-shadow: 0 0 40px var(--primary-glow); transform: scale(1.03); }

        .particle {
            position: absolute; border-radius: 50%; pointer-events: none;
            animation: fly 0.6s ease-out forwards;
        }
        @keyframes fly { to { transform: translate(var(--x), var(--y)); opacity: 0; } }
    </style>
</head>
<body onclick="startBGM()">

<!-- 音乐开关按钮 -->
<button id="music-ctrl" onclick="toggleMusic(event)">🎵 音乐: 开启</button>

<!-- 背景音乐 -->
<audio id="bg-music" loop preload="auto">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="star-field"></div>

<div class="planet-container" style="left: 15%; bottom: 15%;">
    <div class="planet" style="--color: #ff8c42; width: 100px; height: 100px;"></div>
    <div class="ring" style="--angle: -20deg; width: 180px;"></div>
</div>

<div class="planet-container" style="right: 10%; top: 15%;">
    <div class="planet" style="--color: #7a00ff; width: 60px; height: 60px;"></div>
    <div class="ring" style="--angle: 30deg; width: 120px; height: 30px;"></div>
</div>

<div class="planet-container" style="right: 40%; bottom: 10%;">
    <div class="planet" style="--color: #00d8ff; width: 40px; height: 40px;"></div>
</div>

<div class="astronaut">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="25" y="35" width="50" height="40" rx="5" fill="#ccc" />
        <path d="M35 30 H65 V70 Q65 80 55 80 H45 Q35 80 35 70 Z" fill="#fff" />
        <circle cx="50" cy="30" r="22" fill="#fff" />
        <rect x="35" y="20" width="30" height="18" rx="8" fill="#333" />
        <rect x="38" y="22" width="10" height="5" rx="2" fill="rgba(255,255,255,0.2)" />
        <rect x="37" y="75" width="10" height="15" rx="3" fill="#fff" />
        <rect x="53" y="75" width="10" height="15" rx="3" fill="#fff" />
        <path d="M35 45 Q20 50 25 60" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" />
        <path d="M65 45 Q80 50 75 60" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" />
    </svg>
</div>

<div class="ufo-fixed">🛸</div>

<h1>TypeBurst AI: Space Rush</h1>

<div id="control-panel">
    <select id="typeSelect">
        <option value="单词手速">单词手速 (English)</option>
        <option value="中文手速">中文手速 (Chinese)</option>
        <option value="趣味数学">趣味数学 (Math)</option>
    </select>
</div>

<div id="game-stage">
    <canvas id="bgCanvas" style="position: absolute; top:0; left:0; z-index: -1;"></canvas>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
</div>

<div id="input-container">
    <input type="text" id="userInput" placeholder="敲击任意键开启宇宙乐章..." autofocus autocomplete="off">
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const userInput = document.getElementById('userInput');
    const typeSelect = document.getElementById('typeSelect');

    const bgMusic = document.getElementById('bg-music');
    const musicBtn = document.getElementById('music-ctrl');

    // --- 音量调节：设置为0.05（非常轻柔） ---
    bgMusic.volume = 0.05;

    let bubbles = [];
    let meteors = [];
    let audioCtx;

    // --- 优化后的音乐功能 ---
    function startBGM() {
        // 初始化音频上下文（用于炸裂音效）
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        // 只有在停止时才尝试播放，防止冲突
        if (bgMusic.paused) {
            bgMusic.play().catch(e => {});
        }
    }

    // 监听音乐停止/卡顿情况，自动恢复
    bgMusic.addEventListener('stalled', () => {
        if (!bgMusic.paused) bgMusic.play();
    });

    // 确保无限循环播放
    bgMusic.addEventListener('ended', () => {
        bgMusic.currentTime = 0;
        bgMusic.play();
    });

    function toggleMusic(e) {
        e.stopPropagation();
        if (bgMusic.paused) {
            bgMusic.play();
            musicBtn.innerText = "🎵 音乐: 开启";
        } else {
            bgMusic.pause();
            musicBtn.innerText = "🔇 音乐: 关闭";
        }
    }

    function createStars() {
        const field = document.getElementById('star-field');
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            field.appendChild(star);
        }
    }
    createStars();

    function resizeBg() { bgCanvas.width = 900; bgCanvas.height = 600; }
    resizeBg();

    function playPopSound() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    class Meteor {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * bgCanvas.width + 200;
            this.y = -50;
            this.len = Math.random() * 80 + 40;
            this.speed = Math.random() * 5 + 3;
        }
        update() {
            this.x -= this.speed; this.y += this.speed;
            if (this.y > bgCanvas.height || this.x < -100) this.reset();
        }
        draw() {
            bgCtx.strokeStyle = "rgba(255,255,255,0.3)";
            bgCtx.lineWidth = 1;
            bgCtx.beginPath();
            bgCtx.moveTo(this.x, this.y);
            bgCtx.lineTo(this.x + this.len, this.y - this.len);
            bgCtx.stroke();
        }
    }
    for(let i=0; i<6; i++) meteors.push(new Meteor());

    class Bubble {
        constructor(text, answer) {
            this.text = text;
            this.answer = answer.toString();
            this.width = Math.max(120, text.length * 15 + 40);
            this.height = 55;
            this.x = Math.random() * (canvas.width - this.width) + this.width/2;
            this.y = -50;
            this.speed = 0.8 + Math.random() * 0.5;
            this.color = `hsla(${Math.random() * 360}, 70%, 75%, 0.9)`;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.shadowBlur = 15; ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.roundRect(-this.width/2, -this.height/2, this.width, this.height, 25);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.fillStyle = "#111";
            ctx.font = "bold 18px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(this.text, 0, 0);
            ctx.restore();
        }
        update() { this.y += this.speed; }
    }

    function createBurst(x, y, color) {
        const stage = document.getElementById('game-stage');
        for (let i = 0; i < 10; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.width = p.style.height = Math.random() * 6 + 2 + 'px';
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.style.background = color;
            p.style.setProperty('--x', (Math.random() - 0.5) * 200 + 'px');
            p.style.setProperty('--y', (Math.random() - 0.5) * 200 + 'px');
            stage.appendChild(p);
            setTimeout(() => p.remove(), 600);
        }
    }

    async function fetchAiQuestion() {
        if (bubbles.length > 6) return;
        try {
            const res = await fetch(`/api/question?type=${encodeURIComponent(typeSelect.value)}`);
            const data = await res.json();
            if (data.content) bubbles.push(new Bubble(data.content, data.answer));
        } catch (e) {}
    }
    setInterval(fetchAiQuestion, 2000);

    function animate() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        meteors.forEach(m => { m.update(); m.draw(); });
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = bubbles.length - 1; i >= 0; i--) {
            const b = bubbles[i];
            b.update(); b.draw();
            if (b.y > canvas.height + 50) bubbles.splice(i, 1);
        }
        requestAnimationFrame(animate);
    }

    userInput.addEventListener('input', () => {
        startBGM();
        const val = userInput.value.trim().toLowerCase();
        const idx = bubbles.findIndex(b => b.answer.toLowerCase() === val);
        if (idx !== -1) {
            const b = bubbles[idx];
            playPopSound();
            createBurst(b.x, b.y, b.color);
            bubbles.splice(idx, 1);
            userInput.value = '';
        }
    });

    animate();
</script>
</body>
</html>
