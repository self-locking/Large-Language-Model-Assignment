<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>TypeBurst AI - 活力星空版</title>
    <style>
        body {
            display: flex; flex-direction: column; align-items: center;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: white; font-family: 'Microsoft YaHei';
            margin: 0; padding: 20px; min-height: 100vh; overflow: hidden;
        }
        h1 {
            color: #00d8ff; text-shadow: 0 0 20px rgba(0,216,255,0.6);
            margin-top: 0; z-index: 10;
        }

        #game-stage {
            position: relative; width: 900px; height: 600px;
            background: rgba(15, 52, 96, 0.4);
            border: 2px solid rgba(0, 216, 255, 0.5);
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }

        #control-panel { margin-bottom: 15px; z-index: 10; }
        select {
            padding: 10px 20px; border-radius: 20px;
            background: #16213e; color: #00d8ff;
            border: 1px solid #00d8ff; cursor: pointer; outline: none;
        }

        #input-container { margin-top: 25px; z-index: 10; }
        input {
            padding: 18px; font-size: 22px; width: 480px;
            border-radius: 40px; border: 2px solid #00d8ff;
            background: rgba(26, 26, 46, 0.8); color: white;
            text-align: center; outline: none; transition: 0.3s;
        }
        input:focus { box-shadow: 0 0 30px rgba(0, 216, 255, 0.6); transform: scale(1.02); }

        /* 气泡炸裂动画 */
        .pop-effect {
            position: absolute; border-radius: 50%; pointer-events: none;
            animation: pop-anim 0.4s cubic-bezier(0, 0, 0.2, 1) forwards;
            border: 2px solid #fff;
        }
        @keyframes pop-anim {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* 装饰粒子样式 */
        .particle {
            position: absolute; background: #fff; border-radius: 50%;
            pointer-events: none; animation: fly 0.6s ease-out forwards;
        }
        @keyframes fly {
            to { transform: translate(var(--x), var(--y)); opacity: 0; }
        }
    </style>
</head>
<body>

<h1>TypeBurst AI: Space Rush</h1>

<div id="control-panel">
    <select id="typeSelect">
        <option value="单词手速">单词手速 (English)</option>
        <option value="中文手速">中文手速 (Chinese)</option>
        <option value="趣味数学">趣味数学 (Math)</option>
    </select>
</div>

<div id="game-stage">
    <canvas id="bgCanvas" style="position: absolute; top:0; left:0; z-index: -1;"></canvas>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
</div>

<div id="input-container">
    <input type="text" id="userInput" placeholder="敲击键盘，点亮夜空..." autofocus autocomplete="off">
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const userInput = document.getElementById('userInput');
    const typeSelect = document.getElementById('typeSelect');

    let bubbles = [];
    let meteors = [];

    // 初始化背景Canvas大小
    function resizeBg() {
        bgCanvas.width = 900;
        bgCanvas.height = 600;
    }
    resizeBg();

    // --- 音效引擎 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playPopSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    // --- 流星背景逻辑 ---
    class Meteor {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * bgCanvas.width;
            this.y = -20;
            this.len = Math.random() * 80 + 20;
            this.speed = Math.random() * 4 + 2;
            this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
            this.x -= this.speed;
            this.y += this.speed;
            if (this.y > bgCanvas.height || this.x < -100) this.reset();
        }
        draw() {
            bgCtx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
            bgCtx.lineWidth = 2;
            bgCtx.beginPath();
            bgCtx.moveTo(this.x, this.y);
            bgCtx.lineTo(this.x + this.len, this.y - this.len);
            bgCtx.stroke();
        }
    }
    for(let i=0; i<6; i++) meteors.push(new Meteor());

    // --- 游戏气泡逻辑 ---
    class Bubble {
        constructor(text, answer) {
            this.text = text;
            this.answer = answer.toString();
            ctx.font = "bold 20px Arial";
            this.width = Math.max(110, ctx.measureText(text).width + 60);
            this.height = 60;
            this.isLong = text.length > 8;
            this.x = Math.random() * (canvas.width - this.width) + this.width/2;
            this.y = -50;
            this.speed = this.isLong ? 0.4 : 0.8;
            this.hue = Math.random() * 360;
            this.color = `hsla(${this.hue}, 70%, 70%, 0.9)`;
        }
        draw() {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 30);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 15; ctx.shadowColor = this.color;
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.8)";
            ctx.stroke();
            ctx.fillStyle = "#1a1a2e"; ctx.font = "bold 18px 'Microsoft YaHei'";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
        }
        update() { this.y += this.speed; }
    }

    // 粒子爆炸效果
    function createBurstParticles(x, y, color) {
        const stage = document.getElementById('game-stage');
        for (let i = 0; i < 12; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 6 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.style.background = color;
            const tx = (Math.random() - 0.5) * 200;
            const ty = (Math.random() - 0.5) * 200;
            p.style.setProperty('--x', tx + 'px');
            p.style.setProperty('--y', ty + 'px');
            stage.appendChild(p);
            setTimeout(() => p.remove(), 600);
        }
    }

    async function fetchAiQuestion() {
        if (bubbles.some(b => b.isLong)) return;
        try {
            const res = await fetch(`/api/question?type=${encodeURIComponent(typeSelect.value)}`);
            const data = await res.json();
            if (data.content) {
                if (data.content.length > 8 && bubbles.length > 0) return;
                bubbles.push(new Bubble(data.content, data.answer));
            }
        } catch (e) {}
    }
    setInterval(fetchAiQuestion, 2000);

    function animate() {
        // 背景动画
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        meteors.forEach(m => { m.update(); m.draw(); });

        // 游戏动画
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = bubbles.length - 1; i >= 0; i--) {
            const b = bubbles[i];
            b.update(); b.draw();
            if (b.y - 100 > canvas.height) bubbles.splice(i, 1);
        }
        requestAnimationFrame(animate);
    }

    userInput.addEventListener('input', () => {
        const val = userInput.value.trim().toLowerCase();
        const idx = bubbles.findIndex(b => b.answer.toLowerCase() === val);
        if (idx !== -1) {
            const b = bubbles[idx];
            playPopSound();
            createBurstParticles(b.x, b.y, b.color);
            bubbles.splice(idx, 1);
            userInput.value = '';
        }
    });

    animate();
</script>
</body>
</html>
