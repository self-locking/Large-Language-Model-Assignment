<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>TypeBurst AI - 极致手速</title>
    <style>
        /* 样式保持一致，仅调整部分细节 */
        body { display: flex; flex-direction: column; align-items: center; background-color: #1a1a2e; color: white; font-family: 'Microsoft YaHei'; margin: 0; padding: 20px; }
        #game-stage { position: relative; width: 900px; height: 600px; background: #0f3460; border: 4px solid #00d8ff; border-radius: 15px; overflow: hidden; }
        #control-panel { margin-bottom: 15px; display: flex; gap: 10px; }
        select { padding: 8px; border-radius: 5px; background: #16213e; color: white; border: 1px solid #00d8ff; }
        input { padding: 15px; font-size: 20px; width: 400px; border-radius: 30px; border: 2px solid #00d8ff; text-align: center; }
        .stats { font-size: 24px; margin-bottom: 10px; }
    </style>
</head>
<body>

<h1>TypeBurst AI: Speed Edition</h1>

<div id="control-panel">
    <label>模式：</label>
    <select id="typeSelect">
        <option value="单词手速">单词手速 (English)</option>
        <option value="中文手速">中文手速 (Chinese)</option>
        <option value="趣味数学">趣味数学 (Math)</option> </select>
</div>

<div class="stats">得分: <span id="score">0</span> | 失败: <span id="missed">0</span> / 10</div>
<div id="game-stage"><canvas id="gameCanvas" width="900" height="600"></canvas></div>
<div id="ui-panel"><input type="text" id="userInput" placeholder="观察气泡，快速敲击..." autofocus></div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const userInput = document.getElementById('userInput');
    const typeSelect = document.getElementById('typeSelect');

    let score = 0, missed = 0, bubbles = [], gameActive = true;

    class Bubble {
        constructor(text, answer) {
            this.text = text;
            this.answer = answer;
            this.isLong = text.length > 6;

            // 动态计算尺寸：根据文字长度调整宽度
            ctx.font = "bold 20px Arial";
            const textWidth = ctx.measureText(text).width;
            this.width = textWidth + 40;
            this.height = 60;

            this.x = Math.random() * (canvas.width - this.width) + this.width/2;
            this.y = -50;

            // 逻辑：长句子下落变慢
            this.speed = this.isLong ? 0.3 : 0.6;
            this.color = this.isLong ? "rgba(0, 216, 255, 0.8)" : "rgba(78, 228, 78, 0.8)";
        }

        draw() {
            // 绘制胶囊型气泡
            ctx.beginPath();
            ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 30);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#1a1a2e";
            ctx.font = "bold 20px Arial";
            ctx.textAlign = "center";
            ctx.fillText(this.text, this.x, this.y + 7);
        }
        update() { this.y += this.speed; }
    }

    async function fetchAiQuestion() {
        if (!gameActive) return;

        // 特殊规则：如果屏幕上有长句子，不产生新气泡
        if (bubbles.some(b => b.isLong)) return;

        try {
            const res = await fetch(`/api/question?type=${encodeURIComponent(typeSelect.value)}&diff=简单`);
            const data = await res.json();
            if (data.content) {
                // 如果新生成的题是长句，且屏幕已有气泡，则跳过本次生成
                const isNewLong = data.content.length > 6;
                if (isNewLong && bubbles.length > 0) return;

                bubbles.push(new Bubble(data.content, data.answer));
            }
        } catch (e) { console.error(e); }
    }

    setInterval(fetchAiQuestion, 3000);

    function animate() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        bubbles.forEach((b, i) => {
            b.update();
            b.draw();
            if (b.y - 30 > canvas.height) {
                bubbles.splice(i, 1);
                missed++;
                document.getElementById('missed').innerText = missed;
                if (missed >= 10) { gameActive = false; alert("游戏结束！"); location.reload(); }
            }
        });
        requestAnimationFrame(animate);
    }

    userInput.addEventListener('input', () => {
        const val = userInput.value.trim();
        // 实时匹配逻辑：手速模式通常输入正确立刻消失
        const idx = bubbles.findIndex(b => b.answer === val);
        if (idx !== -1) {
            bubbles.splice(idx, 1);
            score += 10;
            document.getElementById('score').innerText = score;
            userInput.value = '';
        }
    });

    animate();
</script>
</body>
</html>
