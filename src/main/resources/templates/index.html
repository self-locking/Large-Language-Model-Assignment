<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>TypeBurst AI - 极致打击感版</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background-color: #1a1a2e; color: white; font-family: 'Microsoft YaHei'; margin: 0; padding: 20px; }
        h1 { color: #00d8ff; text-shadow: 0 0 15px rgba(0,216,255,0.8); }
        #game-stage { position: relative; width: 900px; height: 600px; background: #0f3460; border: 4px solid #00d8ff; border-radius: 15px; overflow: hidden; box-shadow: 0 0 30px rgba(0,216,255,0.2); }
        #control-panel { margin-bottom: 15px; display: flex; gap: 10px; }
        select { padding: 10px; border-radius: 5px; background: #16213e; color: white; border: 1px solid #00d8ff; cursor: pointer; }
        input { padding: 18px; font-size: 22px; width: 480px; border-radius: 40px; border: 3px solid #00d8ff; background: #1a1a2e; color: white; text-align: center; outline: none; transition: 0.3s; box-shadow: inset 0 0 10px rgba(0,216,255,0.2); }
        input:focus { box-shadow: 0 0 20px #00d8ff; border-color: #ffffff; }

        /* 气泡炸裂 CSS 动画 */
        .pop-effect {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: pop-anim 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 3px solid #ffffff;
            box-shadow: 0 0 20px #00d8ff;
        }
        @keyframes pop-anim {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; border-width: 12px; }
        }
    </style>
</head>
<body>

<h1>TypeBurst AI: High-Fidelity</h1>

<div id="control-panel">
    <select id="typeSelect">
        <option value="单词手速">单词手速 (English)</option>
        <option value="中文手速">中文手速 (Chinese)</option>
        <option value="趣味数学">趣味数学 (Math)</option>
    </select>
</div>

<div id="game-stage"><canvas id="gameCanvas" width="900" height="600"></canvas></div>
<div style="margin-top: 25px;"><input type="text" id="userInput" placeholder="感受清脆的炸裂声..." autofocus autocomplete="off"></div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const userInput = document.getElementById('userInput');
    const typeSelect = document.getElementById('typeSelect');

    let bubbles = [];

    // --- 极致音效引擎：清脆敲击音 ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playPopSound() {
        // 确保音频上下文在交互后启动
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        // 1. 使用三角波（Triangle），比正弦波清脆，比方波柔和
        oscillator.type = 'triangle';

        // 2. 频率从高频瞬间滑落，产生“钉”的一声
        oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);

        // 3. 高通滤波器：滤掉低频沉闷声，保留高频清脆声
        filter.type = 'highpass';
        filter.frequency.value = 800;

        // 4. 音量包络：加大起始音量 (0.8)，极速衰减
        gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

        oscillator.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15);
    }

    // 气泡逻辑
    class Bubble {
        constructor(text, answer) {
            this.text = text;
            this.answer = answer.toString();
            ctx.font = "bold 22px Arial";
            const textWidth = ctx.measureText(text).width;
            this.width = Math.max(110, textWidth + 60);
            this.height = 65;
            this.isLong = text.length > 8;
            this.x = Math.random() * (canvas.width - this.width) + this.width/2;
            this.y = -60;
            this.speed = this.isLong ? 0.4 : 1.0; // 稍微提升了普通速度
            this.color = this.isLong ? "#00d8ff" : `hsla(${Math.random() * 360}, 80%, 75%, 1)`;
        }

        draw() {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(this.x - this.width/2, this.y - this.height/2, this.width, this.height, 32);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = "rgba(0,0,0,0.4)";
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = "#1a1a2e";
            ctx.font = "bold 20px 'Microsoft YaHei'";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
        }
        update() { this.y += this.speed; }
    }

    function createPopEffect(x, y, width, height, color) {
        const stage = document.getElementById('game-stage');
        const effect = document.createElement('div');
        effect.className = 'pop-effect';
        effect.style.left = (x - width/2) + 'px';
        effect.style.top = (y - height/2) + 'px';
        effect.style.width = width + 'px';
        effect.style.height = height + 'px';
        effect.style.borderColor = "#ffffff"; // 特效边缘改为纯白，视觉上更闪亮
        stage.appendChild(effect);
        setTimeout(() => effect.remove(), 350);
    }

    async function fetchAiQuestion() {
        if (bubbles.some(b => b.isLong)) return;
        try {
            const res = await fetch(`/api/question?type=${encodeURIComponent(typeSelect.value)}`);
            const data = await res.json();
            if (data.content) {
                if (data.content.length > 8 && bubbles.length > 0) return;
                bubbles.push(new Bubble(data.content, data.answer));
            }
        } catch (e) {}
    }

    setInterval(fetchAiQuestion, 1800); // 稍微加快了出题频率

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = bubbles.length - 1; i >= 0; i--) {
            const b = bubbles[i];
            b.update();
            b.draw();
            if (b.y - 100 > canvas.height) bubbles.splice(i, 1);
        }
        requestAnimationFrame(animate);
    }

    userInput.addEventListener('input', () => {
        const val = userInput.value.trim().toLowerCase();
        const idx = bubbles.findIndex(b => b.answer.toLowerCase() === val);
        if (idx !== -1) {
            const b = bubbles[idx];
            playPopSound(); // 触发增强版清脆音效
            createPopEffect(b.x, b.y, b.width, b.height, b.color);
            bubbles.splice(idx, 1);
            userInput.value = '';
        }
    });

    animate();
</script>
</body>
</html>
