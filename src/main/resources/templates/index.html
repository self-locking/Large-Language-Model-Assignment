<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>TypeBurst - 气泡消除大作战</title>
    <style>
        body {
            display: flex; flex-direction: column; align-items: center;
            background-color: #2c3e50; color: white; font-family: 'Arial', sans-serif;
            margin: 0; padding: 20px;
        }
        #game-stage {
            position: relative; width: 600px; height: 500px;
            background: linear-gradient(to bottom, #1e272e, #485460);
            border: 4px solid #d2dae2; border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        #ui-panel { margin-top: 20px; text-align: center; }
        input {
            padding: 12px 20px; font-size: 20px; border-radius: 25px;
            border: none; outline: none; width: 250px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            color: #333;
        }
        .stats { font-size: 24px; margin-bottom: 10px; }
    </style>
</head>
<body>

<h1>TypeBurst 气泡消除</h1>

<div class="stats">
    得分: <span id="score">0</span> | 失败: <span id="missed">0</span>
</div>

<div id="game-stage">
    <canvas id="gameCanvas" width="600" height="500"></canvas>
</div>

<div id="ui-panel">
    <input type="text" id="userInput" placeholder="在此输入答案..." autofocus autocomplete="off">
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const userInput = document.getElementById('userInput');
    const scoreElement = document.getElementById('score');
    const missedElement = document.getElementById('missed');

    let score = 0;
    let missed = 0;
    let bubbles = [];
    let gameActive = true;

    class Bubble {
        constructor(text, answer) {
            this.text = text;
            this.answer = answer;
            this.x = Math.random() * (canvas.width - 100) + 50;
            this.y = -50;
            this.speed = Math.random() * 0.8 + 0.5;
            this.radius = 40;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            ctx.fill();
            ctx.strokeStyle = "#00d8ff";
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.closePath();
            ctx.fillStyle = "#2c3e50";
            ctx.font = "bold 18px Arial";
            ctx.textAlign = "center";
            ctx.fillText(this.text, this.x, this.y + 7);
        }
        update() { this.y += this.speed; }
    }

    function generateQuestion() {
        const a = Math.floor(Math.random() * 10);
        const b = Math.floor(Math.random() * 10);
        return { q: `${a}+${b}`, a: (a + b).toString() };
    }

    setInterval(() => {
        if (gameActive) {
            const data = generateQuestion();
            bubbles.push(new Bubble(data.q, data.a));
        }
    }, 2000);

    function animate() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        bubbles.forEach((bubble, index) => {
            bubble.update();
            bubble.draw();
            if (bubble.y - bubble.radius > canvas.height) {
                bubbles.splice(index, 1);
                missed++;
                missedElement.innerText = missed;
            }
        });
        requestAnimationFrame(animate);
    }

    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = userInput.value.trim();
            const foundIndex = bubbles.findIndex(b => b.answer === val);
            if (foundIndex !== -1) {
                bubbles.splice(foundIndex, 1);
                score += 10;
                scoreElement.innerText = score;
            }
            userInput.value = '';
        }
    });

    animate();
</script>
</body>
</html>
